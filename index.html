<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#f2f6ff;--card:#fff;--ink:#16224d;--mut:#4d5a86;--pri:#0038a8;--onpri:#fff;--sun:#fcd116;--onsun:#3d3000;--ok:#146c2e;--okbg:#dff5e5;--hint:#fff3bf;--hintink:#4d3b00;--line:#ccd6f2;--bad:#8a2a00;--badbg:#ffe9dc;--h:#ce1126;--t:#0038a8;--o:#1b8a3a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1530;--card:#18224a;--ink:#eef2ff;--mut:#b4c0ea;--pri:#8fb0ff;--onpri:#0b1230;--sun:#fcd116;--onsun:#3d3000;--ok:#9be7b1;--okbg:#14391f;--hint:#4a3d00;--hintink:#ffeaa0;--line:#33427a;--bad:#ffc9a8;--badbg:#4a2410;--h:#ff6b7d;--t:#8fb0ff;--o:#6fdc8c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1530;--card:#18224a;--ink:#eef2ff;--mut:#b4c0ea;--pri:#8fb0ff;--onpri:#0b1230;--sun:#fcd116;--onsun:#3d3000;--ok:#9be7b1;--okbg:#14391f;--hint:#4a3d00;--hintink:#ffeaa0;--line:#33427a;--bad:#ffc9a8;--badbg:#4a2410;--h:#ff6b7d;--t:#8fb0ff;--o:#6fdc8c;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:1.7rem;margin:.2em 0}h2{font-size:1.25rem;margin:.3em 0}p{margin:.4em 0}
.mut{color:var(--mut);font-size:.9rem}
nav{display:flex;gap:8px;margin-bottom:12px}
nav button{flex:1}
button{font:inherit;font-weight:700;min-height:52px;padding:10px 16px;border-radius:14px;border:2px solid var(--pri);background:var(--card);color:var(--pri);cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--pri);outline-offset:3px}
button.on,button.big{background:var(--pri);color:var(--onpri)}
button.big{width:100%;margin-top:10px;font-size:1.1rem}
button.sun{background:var(--sun);color:var(--onsun);border-color:var(--sun)}
button.ghost{border-color:var(--line);min-height:44px;font-weight:600}
button:disabled{opacity:.55;cursor:default}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.stat b{display:block;font-size:1.6rem}
.bar{height:14px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--sun);border-radius:9px}
.tag{display:inline-block;background:var(--sun);color:var(--onsun);font-weight:700;font-size:.85rem;padding:2px 10px;border-radius:20px}
.badge{display:inline-block;font-size:.85rem;font-weight:700;padding:2px 10px;border-radius:20px;border:2px solid var(--line)}
.blocks{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin:10px 0}
.blocks div{text-align:center;font-size:.85rem;font-weight:700}
.blocks .g{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:120px;margin-bottom:4px;min-height:24px}
.h{width:34px;height:34px;background:var(--h);border-radius:6px}
.t{width:10px;height:34px;background:var(--t);border-radius:4px}
.o{width:10px;height:10px;background:var(--o);border-radius:50%}
.fb{border-radius:14px;padding:12px;margin-top:12px;font-weight:600}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.no{background:var(--badbg);color:var(--bad)}.fb.hint{background:var(--hint);color:var(--hintink)}
input{font:inherit;font-size:1.4rem;width:100%;padding:10px;border:2px solid var(--pri);border-radius:12px;background:var(--card);color:var(--ink);margin-top:10px}
.ch{display:grid;gap:8px;margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}

<script>
//<ENGINE>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const PL=["ones","tens","hundreds"];
const REG={id:"G2-Q1-C10",w:"determine a. the place value of a digit in a 3-digit number, b. the value of a digit, and c. the digit of a number, given its place value."};
function num3(){let a,b,c;do{a=R(1,9);b=R(1,9);c=R(1,9)}while(a==b||b==c||a==c);return ""+a+b+c}
const GEN={
value(){const n=num3(),i=R(0,2),d=n[i],p=2-i,v=d*10**p;return{type:"value",key:"v"+n+i,kind:"num",n,i,text:`In ${n}, what is the value of the digit ${d}?`,answer:""+v,hints:[`Which place is ${d} in: ones, tens or hundreds?`,`${d} is in the ${PL[p]} place. Try ${d} × ${10**p}.`],explain:`${d} is in the ${PL[p]} place, so its value is ${d} × ${10**p} = ${v}.`}},
place(){const n=num3(),i=R(0,2),d=n[i],p=2-i;return{type:"place",key:"p"+n+i,kind:"mc",n,i,text:`In ${n}, which place is the digit ${d} in?`,choices:["Ones","Tens","Hundreds"],answer:PL[p][0].toUpperCase()+PL[p].slice(1),hints:["Read the number from the right: ones, then tens, then hundreds.",`Count the places from the right. ${d} is number ${p+1}.`],explain:`Going from the right: ones, tens, hundreds. ${d} is in the ${PL[p]} place.`}},
digit(){const n=num3(),p=R(0,2),i=2-p;return{type:"digit",key:"d"+n+p,kind:"num",n,i,text:`Which digit is in the ${PL[p]} place of ${n}?`,answer:n[i],hints:[`Ones are on the right. Tens are next. Hundreds are on the left.`,`The ${PL[p]} digit is number ${p+1} from the right.`],explain:`In ${n}, the ${PL[p]} place holds the digit ${n[i]}.`}},
expand(){const n=num3(),i=R(0,2),p=2-i,v=n[i]*10**p,t=[0,1,2].map(j=>j==i?"__":""+n[j]*10**(2-j));return{type:"expand",key:"e"+n+i,kind:"num",n,i,text:`${t.join(" + ")} = ${n}. What number goes in the blank?`,answer:""+v,hints:["Each digit has a value. Hundreds, tens and ones add up to the whole number.",`Which place is missing? Its value is the digit times ${10**p}.`],explain:`${n} = ${[0,1,2].map(j=>n[j]*10**(2-j)).join(" + ")}, so the blank is ${v}.`}}};
function verify(q){if(q.vf)return q.vf();const N=+q.n,p=2-q.i,val=Math.floor((N%10**(p+1))/10**p);
 if(q.type=="value"||q.type=="expand")return q.answer===""+val*10**p;
 if(q.type=="digit")return q.answer===""+val;
 return q.answer===PL[p][0].toUpperCase()+PL[p].slice(1)}
const MCFG={minQuestions:8,masteredScore:.8,minRuns:2,minLevels:2,needsPracticeMin:5,needsPracticeBelow:.6,window:12},RCFG={maxUnmastered:3};
function firstTries(a){const m=new Map();a.forEach(x=>{if(!m.has(x.k))m.set(x.k,x)});return[...m.values()]}
function mscore(a,c=MCFG){const v=firstTries(a).slice(-c.window);return v.length?v.reduce((s,x)=>s+x.s,0)/v.length:0}
function levelPlan(a,c=MCFG){const n=firstTries(a).length;if(!n)return[1,1,1,2,2,2,3,3,3];const sc=mscore(a,c);if(n>=6&&sc>=.8)return[2,2,2,3,3,3,3,3,3];if(sc<.6)return[1,1,1,1,2,2,2,2,3];return[1,1,1,2,2,2,3,3,3]}
function mastery(a,runs,c=MCFG){const v=firstTries(a),n=v.length;if(!a.length)return"Not started";

{id:"G2-Q1-C04",title:"Counting up to 1000",w:"count up to 1000.",goal:"find the number after, before, 10 more and 100 more.",ty:["after","after","before","jump","after","before","jump","after","before"],demos:[{t:"ex",h:"What comes after 399?",b:"<p>399 + 1: the ones make 10, the tens make 10, so the hundreds go up by 1.</p><p><b>After 399 comes 400.</b></p>"},{t:"ex",h:"Counting to 1000",b:"<p>997, 998, 999, then a new place appears.</p><p><b>After 999 comes 1000 (one thousand).</b></p>"}],sum:"to count on, add 1. 10 more changes the tens digit. 100 more changes the hundreds digit."},
{id:"G2-Q1-C05",title:"Reading and writing numerals up to 1000",w:"read and write numerals up to 1000.",goal:"read numbers in words and write them as numerals.",ty:["numword","wordnum","numword","wordnum","wordnum","numword","wordnum","numword","wordnum"],demos:[{t:"ex",h:"346 in words",b:"<p>3 hundreds, 4 tens, 6 ones.</p><p><b>346 = three hundred forty-six</b></p>"},{t:"ex",h:"405 in words",b:"<p>4 hundreds, 0 tens, 5 ones. We do not say the tens.</p><p><b>405 = four hundred five</b></p>"}],sum:"say the hundreds first, then the tens and ones. A place with 0 is not said."},
{id:"G2-Q1-C06",title:"Showing numbers with blocks",w:"recognize and represent numbers up to 1000 using a variety of concrete and pictorial models, and numerals.",goal:"read a number from blocks and build a number from its parts.",ty:["blocks","build","blocks","blocks","build","blocks","blocks","build","blocks"],demos:[{t:"ex",h:"Count the blocks",b:blocks(234)+"<p>Red square = 100, blue stick = 10, green dot = 1.</p><p><b>200 + 30 + 4 = 234</b></p>"},{t:"ex",h:"A zero in the middle",b:blocks(305)+"<p>There are no blue sticks, so 0 tens.</p><p><b>300 + 0 + 5 = 305</b></p>"}],sum:"count the hundreds, tens and ones separately, then put them together."},
{id:"G2-Q1-C07",title:"Counting by 2s, 5s, 10s, 20s, 50s and 100s",w:"count by 2s, 5s, 10s, 20s, 50s, and 100s (not beyond 1000).",goal:"count forward by equal steps and find missing numbers.",ty:["skip","skip","rule","skip","rule","skip","skip","rule","skip"],demos:[{t:"ex",h:"Count by 5s",b:"<p><b>15, 20, 25, 30, 35</b></p><p>Each number is 5 more than the one before. Jump 5 each time.</p>"},{t:"ex",h:"Count by 100s",b:"<p><b>200, 300, 400, 500</b></p><p>Each number is 100 more. Only the hundreds digit changes.</p>"}],sum:"to count by a number, add the same step each time. Look at two neighbours to find the step."},
{id:"G2-Q1-C08",title:"Ordering numbers up to 1000",w:"order numbers up to 1000 from smallest to largest, and vice versa.",goal:"find the smallest and the largest number.",ty:Array(9).fill("order"),demos:[{t:"ex",h:"356 or 389?",b:"<p>Both have 3 hundreds. Now compare the tens: 8 tens is more than 5 tens.</p><p><b>389 is greater than 356.</b></p>"},{t:"ex",h:"Order 508, 285, 520",b:"<p>285 has the fewest hundreds, so it is smallest. 508 and 520 both have 5 hundreds. Compare tens: 0 tens is less than 2 tens.</p><p><b>Smallest to largest: 285, 508, 520</b></p>"}],sum:"compare the hundreds first. If they match, compare the tens, then the ones."},
{id:"G2-Q1-C09",title:"Ordinal numbers up to 20th",w:"describe the position of objects using ordinal numbers up to 20th.",goal:"describe position with ordinal numbers like 14th.",ty:["ordword","ordsuf","ordfront","ordword","ordsuf","ordfront","ordsuf","ordword","ordfront"],demos:[{t:"ex",h:"Ordinal numbers",b:"<p><b>1st, 2nd, 3rd, 4th, 5th ... 11th, 12th, 13th ... 20th</b></p><p>Ordinals tell the position. Most end in th. 1st, 2nd and 3rd are special, but 11th, 12th and 13th end in th.</p>"},{t:"ex",h:"Mia is 14th in line",b:"<p>14th means 13 children come before Mia.</p><p><b>13 children are in front of her.</b></p>"}],sum:"ordinals tell position: first, second, third ... twentieth. The 14th person has 13 people in front."},
{id:"G2-Q1-C10",title:"Place value in 3-digit numbers",w:REG.w,goal:"find the place and the value of a digit in numbers up to 999.",ty:["value","place","digit","expand","value","digit","place","expand","value"],demos:[{t:"demo",n:346},{t:"demo",n:405}],sum:"in a 3-digit number, the digits stand for hundreds, tens and ones. The value of a digit is the digit times its place."},
{id:"G2-Q1-C11",title:"Counting up on a number line",w:"illustrate addition of 2-digit and by 1-digit numbers as “counting up” on the number line.",goal:"add a 1-digit number by hopping on a number line.",ty:["cuadd","cugap","cuadd","curest","cuadd","cugap","curest","cuadd","cuadd"],demos:[{t:"ex",h:"47 + 6",b:nline(47,6,1)+"<p>Hop 6 times from 47.</p><p><b>47 + 6 = 53</b></p>"},{t:"ex",h:"Hop to the next ten",b:nline(47,6,1)+"<p>47 + 3 = 50, then 3 more hops.</p><p><b>47 + 6 = 53</b></p>"}],sum:"counting up means hopping forward on the number line. Hopping to the next ten first makes it easier."},
{id:"G2-Q1-C12",title:"Adding in expanded form",w:"add numbers with sums up to 1000 in expanded form.",goal:"add hundreds, tens and ones separately, then combine.",ty:["xpart","xpart","xtotal","xpart","xtotal","xall","xall","xtotal","xall"],demos:[{t:"ex",h:"243 + 125",b:"<p>243 = 200 + 40 + 3 and 125 = 100 + 20 + 5.</p><p>Hundreds: 300. Tens: 60. Ones: 8.</p><p><b>300 + 60 + 8 = 368</b></p>"},{t:"ex",h:"276 + 158",b:"<p>276 = 200 + 70 + 6 and 158 = 100 + 50 + 8.</p><p>Hundreds: 300. Tens: 120. Ones: 14.</p><p><b>300 + 120 + 14 = 434</b></p>"}],sum:"write each number in expanded form, add the hundreds, tens and ones, then add the three sums together."},
{id:"G2-Q1-C13",title:"Adding numbers with sums up to 1000",w:"add numbers with sums up to 1000, with or without regrouping.",goal:"add 3-digit numbers, with and without regrouping.",ty:["add","add","add","addwp","add","add","addwp","add","addwp"],demos:[{t:"ex",h:"243 + 125",b:"<p>Ones: 3 + 5 = 8. Tens: 4 + 2 = 6. Hundreds: 2 + 1 = 3.</p><p><b>243 + 125 = 368</b></p>"},{t:"ex",h:"276 + 158 (regrouping)",b:"<p>Ones: 6 + 8 = 14. Write 4 and regroup 1 ten.</p><p>Tens: 7 + 5 + 1 = 13. Write 3 and regroup 1 hundred.</p><p>Hundreds: 2 + 1 + 1 = 4.</p><p><b>276 + 158 = 434</b></p>"}],sum:"add the ones, then the tens, then the hundreds. When a column makes 10 or more, regroup to the next place."},
{id:"G2-Q1-C14",title:"Properties of addition",w:"illustrate and apply the following properties of addition using sums up to 1000: a. the sum of zero and any number is equal to the number, b. changing the order of the addends does not change the sum, and c. changing the grouping of the addends does not change the sum.",goal:"use three helpful ideas about adding.",ty:["zero","comm","propname","zero","comm","assoc","propname","assoc","comm"],demos:[{t:"ex",h:"Zero and order",b:"<p>35 + 0 = 35 and 0 + 35 = 35. Adding zero changes nothing.</p><p>24 + 51 = 75 and 51 + 24 = 75. The order does not change the sum.</p>"},{t:"ex",h:"Changing the grouping",b:"<p>(20 + 30) + 10 = 50 + 10 = 60</p><p>20 + (30 + 10) = 20 + 40 = 60</p><p><b>Moving the brackets does not change the sum.</b></p>"}],sum:"adding zero changes nothing, the order does not change the sum, and moving the brackets does not change the sum."},
{id:"G2-Q2-C01",title:"Counting money up to ₱1000",w:"determine and write the value of a number of bills, or a number of coins, or a combination of bills and coins up to ₱1000 (centavo coins only, peso coins only, peso bills only, combined peso coins and peso bills).",goal:"find the total value of peso coins and bills.",ty:["money","money","centavo","money","money","centavo","money","centavo","money"],demos:[{t:"ex",h:"Coins and bills",b:moneySvg([["",[[20,2],[5,3]]]])+"<p>2 ₱20 bills = ₱20, ₱40.</p><p>3 ₱5 coins = ₱5, ₱10, ₱15.</p><p><b>₱40 + ₱15 = ₱55</b></p>"},{t:"ex",h:"Bigger bills",b:moneySvg([["",[[10,2],[50,1],[100,1]]]])+"<p>1 ₱100 bill, 1 ₱50 bill and 2 ₱10 coins.</p><p>₱100 + ₱50 + ₱20</p><p><b>= ₱170</b></p>"}],sum:"count each kind of money by its value, then add the amounts together."},
{id:"G2-Q2-C02",title:"Comparing money",w:"compare the values of different denominations of peso coins and bills up to ₱1000.",goal:"tell which amount of money is worth more.",ty:["mcompare","mcompare","mcompare","mcompare","mcompare","mcompare","mcompare","mcompare","mcompare"],demos:[{t:"ex",h:"A ₱50 bill or a ₱20 bill?",b:moneySvg([["A",[[50,1]]],["B",[[20,1]]]])+"<p>₱50 is more than ₱20.</p><p><b>The ₱50 bill is worth more.</b></p>"},{t:"ex",h:"Two ₱20 bills or one ₱50 bill?",b:moneySvg([["A",[[20,2]]],["B",[[50,1]]]])+"<p>2 ₱20 bills make ₱40. One ₱50 bill is ₱50.</p><p><b>₱50 is more than ₱40.</b></p>"}],sum:"find the total value of each group of money, then compare the totals."},
{id:"G2-Q2-C03",title:"Addition problems with money",w:"solve problems involving addition with sums up to 1000, including problems involving money, with and without regrouping.",goal:"solve addition word problems, including peso problems.",ty:["addwp","add","addwp","add","addwp","addwp","add","addwp","addwp"],demos:[{t:"ex",h:"Ana has ₱245",b:"<p>Ana has ₱245. She gets ₱130 more.</p><p>245 + 130 = 375</p><p><b>She has ₱375.</b></p>"},{t:"ex",h:"With regrouping",b:"<p>Ben has ₱276 and saves ₱158.</p><p>Ones: 6 + 8 = 14. Regroup. Tens: 7 + 5 + 1 = 13. Regroup. Hundreds: 2 + 1 + 1 = 4.</p><p><b>₱434</b></p>"}],sum:"read the problem, decide to add, then add the ones, tens and hundreds. Regroup when a column makes 10 or more."},
{id:"G2-Q2-C04",title:"Measuring and comparing length",w:"measure and compare lengths of objects, in meters (m) or centimeters (cm), and distance in meters, using appropriate measuring tools.",goal:"measure with a ruler and compare lengths.",ty:["measure","lencmp","measure","tool","measure","lencmp","tool","measure","lencmp"],demos:[{t:"ex",h:"Measure with a ruler",b:rulerSvg(7,0)+"<p>Line up one end of the strip with 0. The other end is at 7.</p><p><b>The strip is 7 cm long.</b></p>"},{t:"ex",h:"Compare lengths",b:"<p>A rope is 45 cm long. A ribbon is 38 cm long.</p><p>45 is more than 38.</p><p><b>The rope is longer.</b></p>"}],sum:"line up one end with 0 and read the other end. Compare lengths by comparing the numbers when the unit is the same."},
{id:"G2-Q2-C05",title:"Choosing cm or m",w:"identify and use the appropriate unit (m or cm) to measure the length of an object and the distance between two locations.",goal:"pick the best unit for what you measure.",ty:["unit","unit","unit","measure","unit","unit","measure","unit","unit"],demos:[{t:"ex",h:"Short and long",b:"<p>Use <b>cm</b> for short things like a pencil, an eraser or a spoon.</p><p>Use <b>m</b> for long things and distances like a classroom, a door or the way to the gate.</p>"},{t:"ex",h:"Which unit?",b:"<p>A pencil is about 15 <b>cm</b> long.</p><p>A classroom is about 8 <b>m</b> long.</p>"}],sum:"use cm for short lengths and m for long lengths and distances."},
{id:"G2-Q2-C06",title:"Estimating length and distance",w:"estimate length using meters or centimeters, and distance using meters.",goal:"make a sensible guess for a length.",ty:["estpick","estpick","estruler","estpick","estruler","estpick","estruler","estpick","estruler"],demos:[{t:"ex",h:"Estimate with a ruler",b:rulerSvg(12.7,0)+"<p>The end is between 12 and 13. It is closer to 13.</p><p><b>The strip is about 13 cm.</b></p>"},{t:"ex",h:"Use things you know",b:"<p>A pencil is about 15 cm. A door is about 2 m. A basketball court is about 28 m.</p><p><b>Use these to help you guess other lengths.</b></p>"}],sum:"an estimate is a smart guess. Compare with something you know, like a pencil or a door."},
{id:"G2-Q2-C07",title:"Length and distance problems",w:"solve problems involving length and distance.",goal:"solve word problems about length and distance.",ty:["lenprob","lenprob","lenprob","lenprob","lenprob","lenprob","lenprob","lenprob","lenprob"],demos:[{t:"ex",h:"Cutting a ribbon",b:"<p>A ribbon is 85 cm long. Mia cuts off 30 cm.</p><p>85 − 30 = 55</p><p><b>The ribbon is now 55 cm long.</b></p>"},{t:"ex",h:"Walking a distance",b:"<p>Ana walks 120 m to the gate and 75 m more to the store.</p><p>120 + 75 = 195</p><p><b>She walked 195 m in all.</b></p>"}],sum:"add to join lengths or distances. Subtract to cut off or to find how much longer."},
{id:"G2-Q2-C08",title:"Subtracting on a number line",w:"illustrate subtraction of 2-digit by 1-digit on the number line and as an inverse of addition.",goal:"count back on a number line and see that subtraction undoes addition.",ty:["cbhop","cbinv","cbhop","cbmiss","cbhop","cbinv","cbmiss","cbhop","cbmiss"],demos:[{t:"ex",h:"59 − 6",b:nlineB(59,6,1)+"<p>Start at 59. Hop back 6 times.</p><p><b>59 − 6 = 53</b></p>"},{t:"ex",h:"Subtraction undoes addition",b:"<p>47 + 6 = 53</p><p>So 53 − 6 = 47.</p><p><b>Taking away what you added takes you back.</b></p>"}],sum:"count back to subtract on a number line. Subtraction undoes addition."},
{id:"G2-Q2-C09",title:"Subtracting numbers under 100 with regrouping",w:"subtract numbers where both numbers are less than 100 with regrouping: a. 2-digit minus 1-digit numbers, and b. 2-digit minus 2-digit numbers.",goal:"subtract 2-digit numbers when you need to regroup.",ty:["sub2","sub2","sub2","sub2","sub2","sub2","sub2","sub2","sub2"],demos:[{t:"ex",h:"52 − 7",b:"<p>Ones: 2 is less than 7. Regroup 1 ten: 12 − 7 = 5.</p><p>Tens: 4 tens are left.</p><p><b>52 − 7 = 45</b></p>"},{t:"ex",h:"73 − 48",b:"<p>Ones: 3 is less than 8. Regroup: 13 − 8 = 5.</p><p>Tens: 6 − 4 = 2.</p><p><b>73 − 48 = 25</b></p>"}],sum:"when the top ones digit is smaller, regroup 1 ten into 10 ones, then subtract."},
{id:"G2-Q2-C10",title:"Subtraction problems under 100",w:"solve problems (given orally or in pictures) involving subtraction where both numbers are less than 100, with and without regrouping.",goal:"solve subtraction word problems.",ty:["sub2wp","sub2wp","sub2wp","sub2wp","sub2wp","sub2wp","sub2wp","sub2wp","sub2wp"],demos:[{t:"ex",h:"Mia has 45 stickers",b:"<p>She gives away 18. How many are left?</p><p>45 − 18 = 27</p><p><b>Mia has 27 stickers left.</b></p>"},{t:"ex",h:"Ben has ₱62",b:"<p>He buys a toy for ₱35. How much is left?</p><p>62 − 35 = 27</p><p><b>Ben has ₱27 left.</b></p>"}],sum:"read the problem, decide to subtract, then take away. Regroup when you need to."},
{id:"G2-Q2-C11",title:"Subtracting numbers under 1000",w:"subtract numbers, where both numbers are less than 1000, with and without regrouping.",goal:"subtract 3-digit numbers, with and without regrouping.",ty:["sub","sub","sub","subwp","sub","sub","subwp","sub","subwp"],demos:[{t:"ex",h:"586 − 243",b:"<p>Ones: 6 − 3 = 3. Tens: 8 − 4 = 4. Hundreds: 5 − 2 = 3.</p><p><b>586 − 243 = 343</b></p>"},{t:"ex",h:"452 − 178 (regrouping)",b:"<p>Ones: 2 is less than 8, so regroup 1 ten: 12 − 8 = 4.</p><p>Tens: 4 is less than 7, so regroup 1 hundred: 14 − 7 = 7.</p><p>Hundreds: 3 − 1 = 2.</p><p><b>452 − 178 = 274</b></p><p>Check: 274 + 178 = 452.</p>"}],sum:"subtract the ones, tens, then hundreds. Regroup when the top digit is smaller. Check by adding back."},
{id:"G2-Q2-C12",title:"1- and 2-step subtraction problems",w:"solve 1- and 2-step problems involving subtraction where both numbers are less than 1000 (including problems involving money), with and without regrouping.",goal:"solve problems that take one step or two steps.",ty:["subwp","step2","subwp","step2","step2","subwp","step2","step2","subwp"],demos:[{t:"ex",h:"Two steps",b:"<p>Ana had ₱500. She spent ₱120 and then ₱80.</p><p>Step 1: 500 − 120 = 380</p><p>Step 2: 380 − 80 = 300</p><p><b>She has ₱300 left.</b></p>"},{t:"ex",h:"Add, then subtract",b:"<p>Ben had ₱300. He got ₱150 more, then spent ₱200.</p><p>Step 1: 300 + 150 = 450</p><p>Step 2: 450 − 200 = 250</p><p><b>He has ₱250 left.</b></p>"}],sum:"for a 2-step problem, solve the first step, then use its answer in the second step."},
{id:"G2-Q2-C13",title:"Number and letter patterns",w:"determine the next term/s in increasing or decreasing patterns, e.g., numbers, letters and rhythmic properties, visual elements in arts, and repetitions.",goal:"find the next term in a pattern that goes up or down.",ty:["patnum","patnum","patletter","patdown","patnum","patdown","patletter","patnum","patdown"],demos:[{t:"ex",h:"3, 6, 9, 12",b:"<p>Each number is 3 more than the one before.</p><p><b>The next number is 15.</b></p>"},{t:"ex",h:"Going down and letters",b:"<p>50, 45, 40, 35: each number is 5 less. Next is <b>30</b>.</p><p>A, C, E, G: skip one letter each time. Next is <b>I</b>.</p>"}],sum:"find how the pattern changes each time, then use the same change to find the next term."},
{id:"G2-Q2-C14",title:"Creating patterns",w:"create increasing or decreasing patterns.",goal:"make your own pattern that goes up or down.",ty:["patpick","patcreate","patpick","patcreate","patpick","patcreate","patpick","patcreate","patcreate"],demos:[{t:"ex",h:"Make a pattern that goes up",b:"<p>Start at 10. Add 5 each time.</p><p><b>10, 15, 20, 25</b></p>"},{t:"ex",h:"Make a pattern that goes down",b:"<p>Start at 50. Subtract 10 each time.</p><p><b>50, 40, 30, 20</b></p>"}],sum:"to make a pattern, pick a start number and a rule: add or subtract the same amount each time."},
{id:"G2-Q3-C01",title:"Making pictographs",w:"present raw data, or data in tabular form, in a pictograph with a scale, or vice versa.",goal:"link numbers to symbols in a pictograph with a scale.",ty:["pgsymbols","pgtable","pgsymbols","pgtable","pgsymbols","pgtable","pgsymbols","pgtable","pgsymbols"],demos:[{t:"ex",h:"A pictograph with a scale",b:pgSvg([["Dog",3],["Cat",2],["Bird",1]],5)+"<p>Each ● stands for 5 votes. Dog has 3 ●: 5, 10, 15 votes.</p>"},{t:"ex",h:"From numbers to symbols",b:"<p>To show 20 votes when each ● = 5:</p><p>20 ÷ 5 = 4</p><p><b>Draw 4 ●.</b></p>"}],sum:"in a pictograph with a scale, each symbol stands for more than 1. Divide to find how many symbols. Count by the scale to read them."},
{id:"G2-Q3-C02",title:"Reading pictographs and tables",w:"interpret data in tabular form and in a pictograph with or without scale.",goal:"answer questions from a pictograph or a table.",ty:["pgtotal","pgmost","pgdiff","tabread","pgtotal","pgmost","pgdiff","tabread","pgdiff"],demos:[{t:"ex",h:"Read a pictograph",b:pgSvg([["Mango",4],["Banana",2],["Apple",3]],2)+"<p>Each ● = 2 votes. Mango 8, Banana 4, Apple 6.</p><p>In all: 8 + 4 + 6 = 18. Mango got 4 more votes than Banana.</p>"},{t:"ex",h:"Read a table",b:"<p>Votes: Rice 10, Corn 6, Bread 8.</p><p>Rice has the most. Rice got 4 more votes than Corn.</p>"}],sum:"read the key first. Count the symbols, then count by the scale. Add to find totals and subtract to compare."},
{id:"G2-Q3-C03",title:"Counting equal groups",w:"count the number of concrete objects in a group by repeated addition and create equal groups, using language such as “5 groups of 3” and “5 threes”.",goal:"count equal groups and name them, like 3 groups of 4.",ty:["grpcount","grpphrase","grpadd","grpcount","grpphrase","grpadd","grpcount","grpphrase","grpadd"],demos:[{t:"ex",h:"Equal groups",b:grpSvg(3,4)+"<p>3 groups of 4. Add: 4 + 4 + 4 = 12.</p><p>We can say <b>3 groups of 4</b> or <b>3 fours</b>.</p>"},{t:"ex",h:"Five twos",b:grpSvg(5,2)+"<p>5 groups of 2: 2 + 2 + 2 + 2 + 2 = 10.</p><p>That is <b>5 twos</b>.</p>"}],sum:"equal groups have the same number in each group. Add the same number again and again to count them."},
{id:"G2-Q3-C04",title:"Multiplication as repeated addition",w:"illustrate and write multiplication as repeated addition, using a variety of concrete and pictorial models and numerals, and using a. groups of equal quantities, b. arrays, c. counting by multiples, and d. equal jumps on a number line.",goal:"show multiplication with groups, arrays, counting and jumps.",ty:["arr","mulsent","jumps","mskip","arr","mulsent","jumps","mskip","arr"],demos:[{t:"ex",h:"An array",b:arrSvg(3,4)+"<p>3 rows of 4 dots: 4 + 4 + 4 = 12.</p><p><b>3 × 4 = 12</b></p>"},{t:"ex",h:"Equal jumps",b:jumpSvg(4,5,1)+"<p>4 jumps of 5: 5, 10, 15, 20.</p><p><b>4 × 5 = 20</b></p>"}],sum:"multiplication is repeated addition. 3 × 4 means 3 groups of 4, which is 4 + 4 + 4."},
{id:"G2-Q3-C05",title:"Multiplying with the 2, 3, 4, 5 and 10 tables",w:"multiply numbers using the 2, 3, 4, 5, and 10 multiplication tables.",goal:"multiply by 2, 3, 4, 5 and 10.",ty:["mul","mulmc","mul","mul","mulmc","mul","mul","mulmc","mul"],demos:[{t:"ex",h:"Count by 5s",b:"<p>To find 5 × 4, count by 5s four times: 5, 10, 15, 20.</p><p><b>5 × 4 = 20</b></p>"},{t:"ex",h:"Tens and order",b:"<p>10 × 3 = 30 and 10 × 7 = 70. Just count by tens!</p><p>The order does not change the answer: 3 × 5 = 5 × 3 = 15.</p>"}],sum:"use skip counting to multiply. 2, 3, 4, 5 and 10 tables are built from counting by those numbers. The order does not change the answer."},
{id:"G2-Q3-C06",title:"Multiplication problems, including money",w:"solve multiplication problems using the 2, 3, 4, 5, and 10 multiplication tables, including problems involving money.",goal:"solve word problems with equal groups, including pesos.",ty:["mulprob","mulprob","mulprob","mulprob","mulprob","mulprob","mulprob","mulprob","mulprob"],demos:[{t:"ex",h:"Bags of mangoes",b:"<p>Each bag has 5 mangoes. There are 4 bags.</p><p>5 + 5 + 5 + 5 = 20, or 4 × 5 = 20.</p><p><b>There are 20 mangoes.</b></p>"},{t:"ex",h:"Notebooks",b:"<p>A notebook costs ₱10. How much do 3 notebooks cost?</p><p>10 + 10 + 10 = 30</p><p><b>They cost ₱30.</b></p>"}],sum:"when every group has the same amount, add it again and again or multiply to find the total."},
{id:"G2-Q3-C07",title:"Sharing equally",w:"illustrate division through equal distribution of a number of objects into several groups.",goal:"share objects equally and make equal groups.",ty:["divshare","divgroups","divshare","divgroups","divshare","divgroups","divshare","divgroups","divshare"],demos:[{t:"ex",h:"Share equally",b:pileSvg(12)+"<p>Share 12 stickers equally among 3 children. Give one to each child again and again.</p><p><b>Each child gets 4.</b></p>"},{t:"ex",h:"Equal groups",b:pileSvg(15)+"<p>15 candies are put into groups of 5.</p><p><b>3 groups are made.</b></p>"}],sum:"dividing means sharing equally or making equal groups."},
